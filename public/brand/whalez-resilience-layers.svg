<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 690" role="img" aria-labelledby="title desc">
<title id="title">Whalez-AI resilience architecture overview</title>
<desc id="desc">A public-safe abstraction of the private cloud reference image, showing connectivity, compute, storage, databases, identity and security, monitoring and automation, and backup and recovery. The labels are architecture categories, not proof of current deployment.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset=".5" stop-color="#091d32"/><stop offset="1" stop-color="#06101b"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#53efff"/><stop offset="1" stop-color="#548fff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe2a1"/><stop offset="1" stop-color="#d69a43"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#58adff" stroke-opacity=".055"/></pattern>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#5ebee6"/></marker>
 <style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#eaf7ff}.muted{fill:#9db9d2}.title{font-size:30px;font-weight:850;letter-spacing:.04em}.sub{font-size:16px;letter-spacing:.07em}.label{font-size:20px;font-weight:800}.body{font-size:15px}.tag{font-size:13px;font-weight:700;letter-spacing:.06em}
 .layer{fill:#0a1a2c;stroke:#245b83;stroke-width:1.4}.wire{fill:none;stroke:url(#line);stroke-width:2;stroke-dasharray:6 9;animation:flow 17s linear infinite}
 @keyframes flow{to{stroke-dashoffset:-180}}@media(prefers-reduced-motion:reduce){.wire{animation:none}}
 </style>
</defs>
<rect width="1500" height="690" rx="26" fill="url(#bg)"/><rect width="1500" height="690" rx="26" fill="url(#grid)"/>
<circle cx="750" cy="310" r="420" fill="#1474a5" opacity=".055"/>
<text x="54" y="58" class="sub" fill="#7ceaff">WHALEZ-AI ECOSYSTEM / RESILIENCE VIEW</text>
<text x="54" y="103" class="title">RESILIENCE BY DESIGN</text>
<text x="54" y="133" class="body muted">A layered reference inspired by the private-cloud blueprint — architecture categories, not a live deployment inventory.</text>
<rect x="1202" y="66" width="245" height="42" rx="21" fill="#0b2c42" stroke="#2778a1"/><text x="1324" y="92" text-anchor="middle" class="tag" fill="#95efff">REFERENCE ARCHITECTURE</text>

<!-- cloud provider / hybrid abstraction -->
<rect x="300" y="166" width="900" height="72" rx="18" fill="#0c2340" stroke="#409dcc" stroke-width="1.5"/>
<circle cx="346" cy="202" r="17" fill="#0f3b55" stroke="#65e5ff"/><path d="M334 203q2-11 12-11 9 0 12 8 8-2 9 6h-34Z" fill="#65e5ff"/>
<text x="385" y="196" class="label">Hybrid connectivity &amp; service boundaries</text>
<text x="385" y="220" class="body muted">Route, isolate and coordinate approved access between deployment environments.</text>

