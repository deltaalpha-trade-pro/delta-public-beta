 <text x="100" y="110" text-anchor="middle" class="label">Observability</text><text x="100" y="142" text-anchor="middle" class="body muted">Metrics &amp; logs</text><text x="100" y="164" text-anchor="middle" class="body muted">Automation</text><text x="100" y="186" text-anchor="middle" class="body muted">Deployment signals</text><text x="100" y="211" text-anchor="middle" class="tag" fill="#91e2ff">06</text>
