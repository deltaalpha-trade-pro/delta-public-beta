 <text x="100" y="110" text-anchor="middle" class="label">Recovery</text><text x="100" y="142" text-anchor="middle" class="body muted">Backups</text><text x="100" y="164" text-anchor="middle" class="body muted">Replication</text><text x="100" y="186" text-anchor="middle" class="body muted">Restore testing</text><text x="100" y="211" text-anchor="middle" class="tag" fill="#ffdc96">07</text>
