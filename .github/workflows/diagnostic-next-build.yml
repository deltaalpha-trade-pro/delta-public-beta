name: Diagnostic Next Build

on:
  push:
    branches:
      - "diagnostic/ngn-initialize-typed-from-ready-20260929"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
