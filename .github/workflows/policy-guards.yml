name: Policy Guards

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scope-guard:
    name: Policy Guards / scope-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main --depth=1 || true
      - name: Scope guard
        run: bash ci/policy/scope_guard.sh

  gitignore-exact:
    name: Policy Guards / gitignore-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitignore exact-line check
        run: bash ci/policy/check_gitignore_exact.sh .gitignore ci/policy/gitignore.required.lines

  ban-qe:
    name: Policy Guards / ban-qe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ban regex escape literals
        run: bash ci/policy/ban_regex_escapes.sh .

  policy-tests:
    name: Policy Guards / policy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fixtures
        run: bash ci/policy/tests.sh

  termux-smoke:
    name: Termux Smoke (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Simulate Termux guard
        run: bash scripts/test_termux_guard.sh
        env:
          TERMUX_VERSION: "1"
