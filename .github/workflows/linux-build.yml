name: Linux Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Linux Build / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
